name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      published: ${{ steps.published.outputs.published }}
      # What to diff against when deciding which platforms a release touches.
      base: ${{ steps.resolve.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The diff base is the previous release's tag, which needs the tags.
          fetch-depth: 0

      - name: Resolve version from Cargo.toml
        id: resolve
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::No version found in Cargo.toml"
            exit 1
          fi
          # Cargo.toml is the source of truth. A tag push must agree with it;
          # a manual run has no tag and simply releases what Cargo.toml says.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

          # The previous release tag, for the change detection below. Every
          # commit in this repository is released (there is no separate
          # version-bump-only path), so "what changed since the last release"
          # is exactly what this release contains — and a release that only
          # touched the mobile app has no reason to rebuild Windows.
          #
          # A tag run must measure from its own tag, not from `HEAD`: the tag
          # already exists, so `git describe HEAD` would report it and the diff
          # would be empty, which would drop every job. A manual run has no tag
          # yet, so its HEAD is the commit being released.
          base=""
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            describe_ref="$GITHUB_REF_NAME"
          else
            describe_ref="HEAD"
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${describe_ref}~1" 2>/dev/null) || previous=""
          if [ -n "$previous" ] && git diff --quiet "$previous" "$describe_ref" -- . 2>/dev/null; then
            base=""
          else
            base="$previous"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Releasing $version as v$version (base: ${base:-none})"

      # A published release for this version is already the finished product,
      # so rebuilding it would burn 90 minutes and could replace artifacts
      # people have downloaded. A leftover draft is this workflow's own
      # output, so it does not count and gets overwritten as before.
      - name: Look for an existing published release
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>/dev/null) || draft=missing
          if [ "$draft" = false ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already published; skipping this run"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  # A release only builds the platforms it changed. The alternative — always
  # building every platform — spends ~2.5 runner-hours producing binaries
  # byte-identical to the previous release, and buries a genuine failure under
  # three jobs that were never in question.
  #
  # `dorny/paths-filter` is reused from `test.yml` so "what counts as desktop"
  # and "what counts as mobile" are spelled once, in one vocabulary, for both
  # the tests that gate a PR and the release that follows it.
  changes:
    name: Detect changed paths
    needs: version
    if: needs.version.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `base` is the previous release tag; an empty base (first release,
          # or an unresolvable tag) makes the action diff against the whole
          # tree, which fails safe by building everything.
          base: ${{ needs.version.outputs.base }}
          filters: |
            # Everything the desktop app ships: the binary, the installer, and
            # the appcasts the Windows updater reads.
            #
            # `Cargo.toml`, `Cargo.lock`, and `CHANGELOG.md` are deliberately
            # absent. Every release bumps all three, so listing them would make
            # every release "touch the desktop" and defeat this gate entirely —
            # v0.1.50 shipped a mobile-only change and still rebuilt both
            # Windows installers because the bump matched. The version a build
            # reports comes from the shared `versionName`/`CARGO_PKG_VERSION`,
            # so a Windows build emitted during a mobile-only release would
            # advertise the same number as the one already published.
            #
            # The cost of leaving them out is one release: the first Windows
            # release after this change starts from a tree whose version moved
            # without an installer. The appcast and `latest-windows.txt` are
            # still refreshed on every Windows release, so that release
            # re-points them correctly.
            desktop:
              - 'src/**'
              - 'crates/**'
              - 'build.rs'
              - '.cargo/**'
              - 'locales/**'
              - 'resources/**'
              - 'packages/**'
              - 'scripts/appcast*.ts'
              - 'scripts/bundle-windows.ts'
              - 'scripts/version-sites.ts'
              - 'scripts/bump-version.ts'
              - '.github/workflows/release.yml'

            # The Android APK and the manifest that offers it to installed
            # builds. `versionCode` is derived from the version, and the only
            # thing that publishes an APK anyone is told about is a release —
            # so here the bump *is* the change, and these files stay listed.
            mobile:
              - 'apps/mobile/**'
              - 'packages/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/mobile-manifest.ts'
              - 'scripts/version-sites.ts'
              - 'scripts/bump-version.ts'
              - '.github/workflows/release.yml'
              - 'CHANGELOG.md'

  windows-x86_64:
    name: Windows x86_64
    needs: [version, changes]
    if: |
      needs.version.outputs.published != 'true' &&
      needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add x86_64-pc-windows-msvc

      - uses: oven-sh/setup-bun@v2

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      # rust-cache instead of caching the whole target/ tree: raw entries
      # ran 2.6 GB per matrix leg and pushed the repo past GitHub's 10 GB
      # cache budget, so the LRU evicted them before the next release could
      # restore anything.
      #
      # The automatic key ends with the job name, and a tag run may only
      # restore its own tag's cache or the default branch's — so a key
      # containing `windows-x86_64` could never match the `test`-named entry
      # the Tests workflow writes on main, and every release built cold.
      # Dropping the job component makes the restore prefix match main's.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          add-job-id-key: false
          # A cache written during a tag run is scoped to that tag, so no later
          # release can ever read it: it just consumes ~1.5 GB of the 10 GB
          # budget per leg and evicts the main-branch entries that are actually
          # reusable. Tag runs read main's cache without writing one; a manual
          # dispatch on main still saves, and that entry does get reused.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Bundle
        env:
          # Scoped to this step, not the workflow: rust-cache hashes the build
          # environment into its key, so a workflow-wide CARGO_TERM_COLOR made
          # this job's key differ from the Tests job's on the same runner and
          # defeated the restore above.
          CARGO_TERM_COLOR: always
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bun scripts/bundle-windows.ts

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: |
            target/release/kerenzikov-${{ needs.version.outputs.version }}-x86_64-pc-windows-msvc.zip
            target/release/Kerenzikov-${{ needs.version.outputs.version }}-x86_64-Setup.exe
          if-no-files-found: error

  windows-arm64:
    name: Windows arm64
    needs: [version, changes]
    if: |
      needs.version.outputs.published != 'true' &&
      needs.changes.outputs.desktop == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add aarch64-pc-windows-msvc

      - uses: oven-sh/setup-bun@v2

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      # Keyed like the x86_64 leg. Nothing on main builds for Windows arm64, so
      # there is no default-branch entry to restore and this leg stays cold —
      # as it always did. `save-if` is what keeps it from also writing a cache
      # scoped to this tag, which no run could ever read.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          add-job-id-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Bundle
        env:
          CARGO_TERM_COLOR: always
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bun scripts/bundle-windows.ts

      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm64
          path: |
            target/release/kerenzikov-${{ needs.version.outputs.version }}-aarch64-pc-windows-msvc.zip
            target/release/Kerenzikov-${{ needs.version.outputs.version }}-aarch64-Setup.exe
          if-no-files-found: error

  # Sibling of the Windows jobs, not a chained workflow: desktop and Android
  # start together on a tag, and the APK lands on the same draft release via
  # the shared draft-release join below.
  android-apk:
    name: Android APK
    needs: [version, changes]
    if: |
      needs.version.outputs.published != 'true' &&
      needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      # No `ref:` override: actions/checkout already checks out the triggering
      # ref, which is the tag on a `v*` push and the branch on a manual
      # dispatch. Pinning it to the resolved tag broke every manual run, since
      # a dispatch creates no tag until the draft release at the end - the
      # checkout failed with "couldn't find remote ref v<version>" before a
      # single build step ran.
      - uses: actions/checkout@v6
        with:
          clean: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # `packages` must be given explicitly: the action defaults to
      # `tools platform-tools`, and `tools` is the legacy package Google
      # retired from the SDK repository, so sdkmanager exits 1 with
      # "Failed to find package 'tools'" and the job dies before any build
      # step. platform-tools is what Gradle actually needs here; the SDK's
      # own platform and build-tools are resolved by the Android Gradle
      # Plugin from compileSdk/buildToolsVersion.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # gradle/actions owns caching: the raw actions/cache key included
      # app/build.gradle, so it changed with every app commit and — combined
      # with the repo sitting at GitHub's 10 GB cache budget — never survived
      # to the next run. This action caches ~/.gradle keyed on the wrapper
      # and lockfiles and prunes stale entries itself.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gradle shells out to `node` for the React Native and Expo plugins and
      # bundles the JS through Expo's CLI, so both runtimes must be present.
      # The lockfile lives at the repository root; the expo-libghostty
      # postinstall downloads prebuilt native libs and is allowed to fail the
      # same way it does on a developer machine — the app builds without it.
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile || true

      - name: Verify mobile dependencies installed
        # Bun hoists every workspace's dependencies to the root node_modules;
        # gradle resolves them by walking up from apps/mobile.
        run: test -d node_modules/expo && test -d node_modules/react-native

      # `reactNativeArchitectures` in gradle.properties lists all four ABIs so a
      # developer's emulator (x86/x86_64) works out of the box. A release must
      # not carry them: each ABI duplicates every native library (~59 MB per
      # ABI, dominated by libreactnative.so), and the emulator ABIs are dead
      # weight on every real device. Narrowing to the two device ABIs here
      # keeps the local default untouched and drops the APK to roughly a third
      # of its universal size.
      - name: Assemble release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # Gradle emits the generic `app-release.apk`; rename it so the asset names
      # its version and variant the way the Windows artifacts do. The APK still
      # contains both device ABIs in one file — `assembleRelease` produces a
      # single APK even with several ABI filters — so there is no per-arch
      # suffix to add.
      #
      # The build number is read back out of the APK here, in the job that
      # built it, rather than in `draft-release`. That job would need a working
      # `aapt2` and `$ANDROID_HOME`, which it has no other reason to set up —
      # this job runs Gradle, so its Android SDK is proven present. The value
      # travels to `draft-release` as an artifact so the manifest still cannot
      # disagree with the binary it points at.
      - name: Name the APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dir="apps/mobile/android/app/build/outputs/apk/release"
          mv "$dir/app-release.apk" "$dir/Kerenzikov-${VERSION}-universal.apk"
          # Anchored to the `package:` line rather than matching versionCode
          # anywhere: a build-tools release has added other versionCode-bearing
          # fields before, and the first line is the manifest's own.
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          code=$("$tools/aapt2" dump badging "$dir/Kerenzikov-${VERSION}-universal.apk" \
            | sed -n "s/^package: name='[^']*' versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          if [ -z "$code" ]; then
            echo "::error::Could not read versionCode from the assembled APK"
            exit 1
          fi
          echo "Read versionCode=$code"
          # Carried in the artifact rather than a job output: the manifest job
          # downloads every artifact anyway, so this keeps the build number
          # attached to the APK it describes instead of passing it separately.
          printf '%s\n' "$code" > "$dir/version-code.txt"
          ls -lah "$dir/Kerenzikov-${VERSION}-universal.apk" "$dir/version-code.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/release/Kerenzikov-*-universal.apk
            apps/mobile/android/app/build/outputs/apk/release/version-code.txt
          if-no-files-found: error

  # Joins every platform job, including the ones that were skipped: a job that
  # did not run must not hold up the release, and a job that ran must not be
  # ignored. `always()` is what lets this start when the changes gate left a
  # platform out; the explicit `result` checks are what turn a real failure
  # into a failed release instead of a draft missing its Windows installer.
  #
  # What this job then does is conditional on which platforms actually built:
  # the appcasts, the R2 upload, and `latest-windows.txt` only make sense when
  # there are fresh Windows artifacts to point at, and the mobile manifest only
  # when there is a fresh APK. A release that changed only Android therefore
  # drafts an Android-only release and leaves the Windows feed alone.
  draft-release:
    name: Draft GitHub release
    needs:
      [
        version,
        changes,
        windows-x86_64,
        windows-arm64,
        android-apk,
      ]
    if: |
      always() &&
      needs.version.outputs.published != 'true' &&
      needs.windows-x86_64.result != 'failure' &&
      needs.windows-x86_64.result != 'cancelled' &&
      needs.windows-arm64.result != 'failure' &&
      needs.windows-arm64.result != 'cancelled' &&
      needs.android-apk.result != 'failure' &&
      needs.android-apk.result != 'cancelled'
    outputs:
      windows: ${{ steps.platforms.outputs.windows }}
      mobile: ${{ steps.platforms.outputs.mobile }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags: the notes fallback lists commits since the
          # previous v* tag.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      # Which platform jobs produced artifacts. Only `dorny/paths-filter`'s
      # own outputs can be relied on here; the job results cannot distinguish
      # "skipped because Windows did not change" from "skipped because
      # something upstream broke".
      - name: Which platforms built
        id: platforms
        run: |
          windows="${{ needs.changes.outputs.desktop }}"
          mobile="${{ needs.changes.outputs.mobile }}"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "Windows: $windows, Android: $mobile"

      # No `if-no-files-found`: `download-artifact@v8` has no such input, and
      # does not need one. When a platform did not build there are simply fewer
      # artifacts, and it logs a zero count rather than failing — which is what
      # an Android-only release depends on.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the version pointers
        if: steps.platforms.outputs.windows == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # What the website's Windows download resolves "latest" to.
          echo "$VERSION" > artifacts/latest-windows.txt

      # The Android app reads this over raw.githubusercontent, so an update
      # offer is a checked-in file rather than a bucket object. Written from
      # the assembled APK — which download-artifact placed in `artifacts/` —
      # so the URL and byte count describe the binary being uploaded. The
      # commit waits until the release exists, at the end of this job: a
      # manifest that landed first would point every installed app at a URL
      # that 404s.
      #
      # The build number comes from `version-code.txt`, written by the job that
      # built the APK and read back out of the binary there — so it is still
      # the value the installed app reports, without this job needing an
      # Android SDK of its own. `scripts/mobile-manifest.ts` refuses the pair
      # when it disagrees with the version being released, which is the check
      # that would have caught the frozen `versionCode` that made v0.1.49 and
      # v0.1.50 un-offerable.
      - name: Generate the mobile update manifest
        if: steps.platforms.outputs.mobile == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          WAKU_MOBILE_RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download
        run: |
          if [ ! -f artifacts/version-code.txt ]; then
            echo "::error::version-code.txt missing; the APK job did not publish a build number"
            exit 1
          fi
          code=$(tr -d '[:space:]' < artifacts/version-code.txt)
          echo "Build number from the APK: $code"
          bun scripts/mobile-manifest.ts artifacts "$code" "$VERSION"

      - name: Generate Windows appcasts
        if: steps.platforms.outputs.windows == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          WAKU_DOWNLOAD_URL_PREFIX: https://pub-a8392f3fe55a424497fe5174b0179915.r2.dev/
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bun scripts/appcast-windows.ts artifacts "$VERSION"
          ls -lah artifacts/appcast-windows-*.xml

      - name: Upload installers and feeds to R2
        if: steps.platforms.outputs.windows == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          sudo apt-get update && sudo apt-get install --yes rclone
          export RCLONE_CONFIG_R2_TYPE=s3
          export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
          export RCLONE_CONFIG_R2_NO_CHECK_BUCKET=true
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Installers never change -> cache 1 year
          rclone copy artifacts "r2:${R2_BUCKET}" \
            --s3-no-check-bucket \
            --include 'Kerenzikov-*-Setup.exe' \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            --progress
          # Feeds change every release -> cache 5 min
          rclone copy artifacts "r2:${R2_BUCKET}" \
            --s3-no-check-bucket \
            --include 'appcast-windows-*.xml' \
            --include 'latest-windows.txt' \
            --header-upload "Cache-Control: public, max-age=300, must-revalidate" \
            --progress

      - name: Write release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          notes=$(bun -e '
            import { extractReleaseNotes } from "./scripts/changelog.ts";
            const version = process.env.VERSION;
            const file = Bun.file("CHANGELOG.md");
            const notes = (await file.exists())
              ? extractReleaseNotes(await file.text(), version)
              : null;
            process.stdout.write(notes ?? "");
          ')
          if [ -n "$notes" ]; then
            printf '%s\n' "$notes" > release-notes.md
            exit 0
          fi
          # No CHANGELOG section for this version: list the commits since
          # the previous v* tag, grouped by conventional prefix.
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG~1" 2>/dev/null) || prev=""
          if [ -z "$prev" ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
            exit 0
          fi
          {
            echo "What's changed since $prev:"
            for group in "feat:Features" "fix:Fixes" "chore:Chores"; do
              prefix="${group%%:*}"
              title="${group##*:}"
              items=$(git log "$prev..$TAG" --pretty=format:'- %s (%h)' --grep="^$prefix" -i)
              if [ -n "$items" ]; then
                printf '\n### %s\n%s\n' "$title" "$items"
              fi
            done
            rest=$(git log "$prev..$TAG" --pretty=format:'- %s (%h)' --invert-grep --grep='^(feat|fix|chore)' -i)
            if [ -n "$rest" ]; then
              printf '\n### Other\n%s\n' "$rest"
            fi
          } > release-notes.md

      # The asset list is computed rather than written as globs. Two reasons:
      #
      # `action-gh-release` does not support `!` negations — it validates every
      # line as a pattern that must match a file, so excluding
      # `mobile-latest.json` that way fails the whole step under
      # `fail_on_unmatched_files`. And fixed patterns (`*.exe`, `*.xml`, …)
      # would fail the other way on an Android-only release, where no installer
      # exists to match. Listing what is actually there is the only form that
      # is correct for both.
      #
      # The two internal files are dropped: the manifest is committed to `main`
      # by the step below, and the build number is an input to it, so neither
      # belongs in the release's downloads.
      - name: Collect release assets
        id: assets
        run: |
          files=$(find artifacts -maxdepth 1 -type f \
            ! -name 'mobile-latest.json' \
            ! -name 'version-code.txt' \
            -printf '%p\n' | sort)
          if [ -z "$files" ]; then
            echo "::error::No artifacts to release"
            exit 1
          fi
          echo "$files"
          {
            echo 'files<<__ASSETS__'
            echo "$files"
            echo '__ASSETS__'
          } >> "$GITHUB_OUTPUT"

      # Only the artifacts that exist: an Android-only release lists one APK
      # and no installers. `fail_on_unmatched_files` stays true, and is
      # meaningful because every listed path is one `find` just saw.
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          # The tag is pushed before this workflow runs (the tag-triggered
          # path) or must already exist for a manual run, so never re-point
          # it: passing target_commitish for an existing tag makes the
          # release API return 404.
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: ${{ steps.assets.outputs.files }}

      # Last, so the URL the manifest names is live by the time the app can
      # read it. The file must land on main because that is the ref
      # raw.githubusercontent serves; this run is detached on the tag, so this
      # moves to main and touches exactly one path rather than carrying the
      # tag's tree across. Idempotent: a re-run writes the same bytes and the
      # staged diff is empty.
      #
      # Skipped when no APK was built: re-committing the previous release's
      # manifest would re-point every installed app at a URL for a build that
      # did not change, which is noise at best and a downgrade prompt at worst.
      - name: Publish the mobile update manifest
        if: steps.platforms.outputs.mobile == 'true'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cp artifacts/mobile-latest.json /tmp/mobile-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main
          cp /tmp/mobile-latest.json apps/mobile/mobile-latest.json
          git add -- apps/mobile/mobile-latest.json
          if git diff --cached --quiet; then
            echo "Manifest already current for $TAG"
            exit 0
          fi
          git commit -m "chore(mobile): publish update manifest for $TAG"
          git push origin main
