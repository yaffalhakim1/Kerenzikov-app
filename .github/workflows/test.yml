name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What changed decides what runs. Everything shares the Rust workspace and
  # the generated protocol, so desktop sources or the protocol pull in the
  # full matrix; a mobile-only change runs just the mobile checks, and a
  # workflow/docs-only change runs nothing.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      client: ${{ steps.filter.outputs.client }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # The desktop app, its crates, and everything the Rust build and
            # tests consume. Also matched by protocol/client changes: the
            # generated artifact is checked in and the desktop compiles it.
            rust:
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.cargo/**'
              - 'locales/**'
              - '.github/workflows/test.yml'
            client:
              - 'packages/waku-client/**'
              - 'waku-client/**'
              - 'scripts/**'
              - 'bun.lock'
              - '.github/workflows/test.yml'
            mobile:
              - 'apps/mobile/**'
              - 'packages/waku-client/**'
              - 'waku-client/**'
              - 'scripts/**'
              - 'bun.lock'
              - '.github/workflows/test.yml'

  test:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libfontconfig-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            xdg-desktop-portal

      # rust-cache over actions/cache: the raw cache stored the entire
      # target/ dir (2-2.6 GB per OS), which blew past the repo's 10 GB
      # cache budget and got evicted before the next run could hit it —
      # every build ran cold. rust-cache stores only crates + built deps
      # pruned against the current lockfile (a few hundred MB), so entries
      # survive and restores actually happen.
      #
      # The job name is left out of the key so the Release workflow — whose
      # jobs are named `windows-x86_64` and `windows-arm64` — can restore this
      # entry. A tag run may read the default branch's cache, but only under a
      # matching key, and the automatic key otherwise ends with the job name.
      # The runner OS and architecture still separate the matrix legs.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          add-job-id-key: false

      - name: Run tests
        run: cargo test --locked

      # The generated protocol and browser client are platform-independent, so
      # one runner is enough to catch a drifted checked-in artifact.
      - name: Install JavaScript dependencies
        if: runner.os == 'Linux'
        run: bun install --frozen-lockfile

      - name: Check generated protocol and browser client
        if: runner.os == 'Linux'
        run: |
          bun run protocol:check
          bun run --filter @waku/client check
          bun run --filter @waku/client test

  # Mobile has its own client code against the same generated protocol and is
  # not covered by the Rust or @waku/client checks, so protocol changes can
  # drift past it silently. Types and unit tests are enough to catch that
  # without an emulator.
  mobile:
    name: Mobile client
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check mobile client
        run: |
          bun run --filter @waku/mobile typecheck
          bun run --filter @waku/mobile test

  # The generated protocol must match its checked-in artifact. Runs whenever
  # anything that feeds the generator changed, including mobile-only pushes.
  client:
    name: Protocol and browser client
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check generated protocol and browser client
        run: |
          bun run protocol:check
          bun run --filter @waku/client check
          bun run --filter @waku/client test
