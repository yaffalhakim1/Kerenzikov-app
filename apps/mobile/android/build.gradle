// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    // Reads android/app/google-services.json into the Firebase config FCM
    // needs. Wired by hand rather than via `expo.android.googleServicesFile`
    // because the release workflow runs `gradlew assembleRelease` directly and
    // never runs the config plugins that would add this.
    classpath('com.google.gms:google-services:4.4.4')
  }
}

// The repository's single version, carried in from the repository root's
// Cargo.toml — the same number the release workflow resolves, the same one
// `scripts/version-sites.ts` writes into every other site.
//
// Reading it at configuration time rather than checking a number in keeps a
// released APK from ever disagreeing with the manifest it was built beside: a
// failed read fails the build, because a wrong `versionCode` would publish a
// release no installed app is ever offered.
def wakuCargoToml = rootProject.file("../../../Cargo.toml")
def wakuCargoText = wakuCargoToml.text
def wakuVersionMatch = (wakuCargoText =~ /(?m)^version = "(\d+\.\d+\.\d+)"$/)
if (wakuVersionMatch.find()) {
  rootProject.ext.wakuVersion = wakuVersionMatch.group(1)
} else {
  throw new GradleException("No `version = \"x.y.z\"` in ${wakuCargoToml}; cannot version this build.")
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
